<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>envaner | Bakımdayız</title>
    
    <!-- Google Fonts: Projenizle tutarlı olması için 'Inter' fontu kullanıldı -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* === TEMEL STİLLER === */
        :root {
            --bg-color: #F9FAFB;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --primary-color: #3B82F6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
        }

        /* === İÇERİK KUTUSU === */
        .container {
            max-width: 550px;
            padding: 2rem;
        }

        /* === İKON === */
        .maintenance-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }

        /* === METİNLER === */
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        h2 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        .footer-text {
            font-size: 0.9rem;
            color: #9ca3af; /* Daha soluk bir renk */
        }
        
        /* === LİNK === */
        a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s ease;
        }
        a:hover {
            border-bottom-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SVG İkonu: Dışarıdan dosya çağırmamak için kod olarak eklendi -->
        <svg class="maintenance-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 1.99982C6.47715 1.99982 2 6.47697 2 11.9998C2 17.5227 6.47715 21.9998 12 21.9998C17.5228 21.9998 22 17.5227 22 11.9998C22 6.47697 17.5228 1.99982 12 1.99982ZM12 3.49982C16.6944 3.49982 20.5 7.30541 20.5 11.9998C20.5 16.6942 16.6944 20.4998 12 20.4998C7.30558 20.4998 3.5 16.6942 3.5 11.9998C3.5 7.30541 7.30558 3.49982 12 3.49982ZM11.25 7.49982V12.4998L15.3 15.035L16 13.9645L12.75 11.9998V7.49982H11.25Z"></path>
        </svg>

        <h1>envaner</h1>
        <h2>Kısa bir mola verdik.</h2>
        <p>
            Uygulamamızı sizin için daha iyi ve hızlı hale getirmek üzere kısa bir bakım çalışması yapıyoruz.
            Anlayışınız için teşekkür ederiz.
        </p>
        <p class="footer-text">
            Lütfen birkaç dakika sonra tekrar deneyin.
        </p>
    </div>
</body>
</html>
