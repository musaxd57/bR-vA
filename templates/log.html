<!DOCTYPE html>
<html lang="tr">
<head>
    {% include '_security_head.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Logs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        /* Üst bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c2c2c;
            padding: 10px 15px;
            flex-wrap: wrap; /* mobilde alt alta geçer */
        }
        header h1 {
            font-size: 20px;
            margin: 0;
        }
        #adminBtn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 5px;
        }
        #adminBtn:hover {
            background-color: #45a049;
        }

        /* Log container */
        #logContainer {
            height: calc(100vh - 60px); /* header boyutu çıkarıldı */
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }
        .log-entry {
            padding: 5px 10px;
            border-bottom: 1px solid #444;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }
        .log-entry:nth-child(odd) {
            background-color: #2a2a2a;
        }
        .log-entry:nth-child(even) {
            background-color: #333;
        }

        /* Küçük ekranlarda fontları biraz küçült */
        @media screen and (max-width: 480px) {
            header h1 {
                font-size: 18px;
            }
            #adminBtn {
                font-size: 12px;
                padding: 6px 12px;
            }
            .log-entry {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Application Logs</h1>
        <button id="adminBtn" onclick="location.href='/admin'">Admin Paneline Git</button>
    </header>

    <div id="logContainer"></div>

    <script>
        const container = document.getElementById('logContainer');

        async function fetchLogs() {
            try {
                const res = await fetch('/logs.json');
                const data = await res.json();
                
                container.innerHTML = '';
                data.logs.forEach(log => {
                    const div = document.createElement('div');
                    div.className = 'log-entry';
                    div.textContent = log;
                    container.appendChild(div);
                });

                // En son logu görünür hâle getir
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error("Log fetch hatası:", e);
            }
        }

        // Başlangıçta fetch et ve her 2 saniyede yenile
        fetchLogs();
        setInterval(fetchLogs, 2000);
    </script>
</body>
</html>
